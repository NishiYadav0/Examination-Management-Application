<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f1f4fb;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1e293b;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f4fb;padding:24px 0;">
<tr><td align="center">
<table width="640" cellpadding="0" cellspacing="0" style="max-width:640px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(30,41,59,.08);">
  <tr><td style="background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:26px 32px;color:#fff;">
    <div style="font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.85;">Examination Management Portal</div>
    <div style="font-size:22px;font-weight:700;margin-top:6px;">{% block title %}{{ subject }}{% endblock %}</div>
  </td></tr>
  <tr><td style="padding:28px 32px;font-size:15px;line-height:1.6;">
    {% block content %}{% endblock %}
  </td></tr>
  <tr><td style="background:#f8fafc;padding:18px 32px;font-size:12px;color:#64748b;text-align:center;">
    This is an automated message from EMP · <a href="{{ frontend_url }}" style="color:#4f46e5;">Open portal</a><br>
    Please do not reply to this e-mail.
  </td></tr>
</table></td></tr></table></body></html>
